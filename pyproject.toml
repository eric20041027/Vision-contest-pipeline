[project]
name = "vcp"
dynamic = ["version"]
description = "vision contest pipeline: reusable data / eval / submission framework for image competitions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pillow>=10.0",
  "scikit-learn>=1.4",
  "iterative-stratification>=0.1.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dicom = [
  "pydicom>=3.0",
  "pylibjpeg>=2.0",
  "pylibjpeg-libjpeg>=2.0",
  "pylibjpeg-openjpeg>=2.0",
]
eval = ["pycocotools>=2.0.8"]

[project.scripts]
vcp = "vcp.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pydicom>=3.0",
  "pylibjpeg>=2.0",
  "pylibjpeg-libjpeg>=2.0",
  "pylibjpeg-openjpeg>=2.0",
  "pycocotools>=2.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/vcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["projects", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "use vcp.core.time.utc_now()"
"datetime.datetime.utcnow".msg = "use vcp.core.time.utc_now()"
"datetime.datetime.today".msg = "use vcp.core.time.utc_now()"
"time.time".msg = "use vcp.core.time.utc_now()"

[tool.ruff.lint.per-file-ignores]
"src/vcp/core/time.py" = ["TID251"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
markers = ["realdata: needs real datasets under VCP_DATA_ROOT; skipped otherwise"]

[tool.coverage.run]
source = ["vcp"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
