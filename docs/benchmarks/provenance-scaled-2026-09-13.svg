<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Scaled provenance p95 latency by baseline</title>
  <desc id="desc">Log scale line chart. Dependency incremental grows from 0.357 milliseconds at one thousand events to 22.035 milliseconds at one million, below both full baselines.</desc>
  <rect width="900" height="500" fill="#fbfaf7"/>
  <text x="70" y="38" font-family="sans-serif" font-size="22" fill="#17202a">Provenance update + materialized view p95 (log ms)</text>
  <g stroke="#c9ced3" stroke-width="1" fill="none">
    <path d="M90 420H850"/><path d="M90 330H850"/><path d="M90 240H850"/><path d="M90 150H850"/><path d="M90 60H850"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#4b5563">
    <text x="45" y="425">0.1</text><text x="55" y="335">1</text><text x="48" y="245">10</text><text x="40" y="155">100</text><text x="30" y="65">1000+</text>
    <text x="112" y="452">1k</text><text x="347" y="452">10k</text><text x="580" y="452">100k</text><text x="814" y="452">1M</text>
  </g>
  <polyline points="125,320 360,212 595,140 830,50" fill="none" stroke="#b42318" stroke-width="4"/>
  <polyline points="125,354 360,261 595,174 830,81" fill="none" stroke="#6f42c1" stroke-width="4"/>
  <polyline points="125,370 360,361 595,298 830,209" fill="none" stroke="#087f5b" stroke-width="4"/>
  <g fill="#b42318"><circle cx="125" cy="320" r="5"/><circle cx="360" cy="212" r="5"/><circle cx="595" cy="140" r="5"/><circle cx="830" cy="50" r="5"/></g>
  <g fill="#6f42c1"><circle cx="125" cy="354" r="5"/><circle cx="360" cy="261" r="5"/><circle cx="595" cy="174" r="5"/><circle cx="830" cy="81" r="5"/></g>
  <g fill="#087f5b"><circle cx="125" cy="370" r="5"/><circle cx="360" cy="361" r="5"/><circle cx="595" cy="298" r="5"/><circle cx="830" cy="209" r="5"/></g>
  <g font-family="sans-serif" font-size="14">
    <rect x="105" y="468" width="18" height="4" fill="#b42318"/><text x="130" y="476" fill="#17202a">full replay</text>
    <rect x="285" y="468" width="18" height="4" fill="#6f42c1"/><text x="310" y="476" fill="#17202a">full SQLite</text>
    <rect x="470" y="468" width="18" height="4" fill="#087f5b"/><text x="495" y="476" fill="#17202a">dependency incremental</text>
  </g>
</svg>
