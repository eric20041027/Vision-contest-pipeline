<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">一場比賽的完整生命週期</title>
  <desc id="desc">由規則整理開始，依序經過資料、切分、快取、基線、量測、融合、推論、提交、決選與備份。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#40516d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1600" height="1040" fill="#f8fafc"/>
  <text x="800" y="60" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="36" font-weight="700" fill="#14213d">一場影像比賽的完整生命週期</text>
  <text x="800" y="100" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="18" fill="#475569">箭頭代表證據與身分的傳遞；關卡失敗時回到前一步修正</text>

  <g stroke="#40516d" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M270 225 H318"/>
    <path d="M550 225 H598"/>
    <path d="M830 225 H878"/>
    <path d="M1110 225 H1158"/>
    <path d="M1390 225 H1450 Q1515 225 1515 290 V410 Q1515 462 1458 462 H1390"/>
    <path d="M1160 462 H1112"/>
    <path d="M880 462 H832"/>
    <path d="M600 462 H552"/>
    <path d="M320 462 H270"/>
    <path d="M155 547 V675"/>
    <path d="M270 762 H492"/>
    <path d="M727 762 H947"/>
  </g>

  <g font-family="Segoe UI, Microsoft JhengHei, sans-serif" filter="url(#shadow)">
    <g transform="translate(40 145)">
      <rect width="230" height="160" rx="20" fill="#ffffff" stroke="#475569" stroke-width="3"/>
      <circle cx="34" cy="34" r="20" fill="#475569"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
      <text x="68" y="42" font-size="21" font-weight="700" fill="#14213d">讀規則</text>
      <text x="22" y="80" font-size="15" fill="#334155">任務、指標、資料權利</text>
      <text x="22" y="106" font-size="15" fill="#334155">提交型態、配額、截止日</text>
      <text x="22" y="137" font-size="14" font-weight="700" fill="#475569">輸出：contest brief</text>
    </g>
    <g transform="translate(320 145)">
      <rect width="230" height="160" rx="20" fill="#ffffff" stroke="#1769aa" stroke-width="3"/>
      <circle cx="34" cy="34" r="20" fill="#1769aa"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
      <text x="68" y="42" font-size="21" font-weight="700" fill="#14213d">匯入資料</text>
      <text x="22" y="80" font-size="15" fill="#334155">import → validate → audit</text>
      <text x="22" y="106" font-size="15" fill="#334155">建立固定樣本身分</text>
      <text x="22" y="137" font-size="14" font-weight="700" fill="#1769aa">關卡：資料結構可信</text>
    </g>
    <g transform="translate(600 145)">
      <rect width="230" height="160" rx="20" fill="#ffffff" stroke="#1769aa" stroke-width="3"/>
      <circle cx="34" cy="34" r="20" fill="#1769aa"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
      <text x="68" y="42" font-size="21" font-weight="700" fill="#14213d">規劃切分</text>
      <text x="22" y="80" font-size="15" fill="#334155">≥ 2 個 eval 子集</text>
      <text x="22" y="106" font-size="15" fill="#334155">另留 sealed holdout</text>
      <text x="22" y="137" font-size="14" font-weight="700" fill="#1769aa">關卡：group 不跨子集</text>
    </g>
    <g transform="translate(880 145)">
      <rect width="230" height="160" rx="20" fill="#ffffff" stroke="#1769aa" stroke-width="3"/>
      <circle cx="34" cy="34" r="20" fill="#1769aa"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">4</text>
      <text x="68" y="42" font-size="21" font-weight="700" fill="#14213d">準備輸入</text>
      <text x="22" y="80" font-size="15" fill="#334155">materialize 解碼快取</text>
      <text x="22" y="106" font-size="15" fill="#334155">export 訓練資料</text>
      <text x="22" y="137" font-size="14" font-weight="700" fill="#1769aa">關卡：manifest 對得上</text>
    </g>
    <g transform="translate(1160 145)">
      <rect width="230" height="160" rx="20" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
      <circle cx="34" cy="34" r="20" fill="#7c3aed"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
      <text x="68" y="42" font-size="21" font-weight="700" fill="#14213d">訓練基線</text>
      <text x="22" y="80" font-size="15" fill="#334155">train run 包住腳本</text>
      <text x="22" y="106" font-size="15" fill="#334155">記 seed、環境、權重</text>
      <text x="22" y="137" font-size="14" font-weight="700" fill="#7c3aed">輸出：可追溯 run</text>
    </g>

    <g transform="translate(1160 382)">
      <rect width="230" height="160" rx="20" fill="#ffffff" stroke="#087f5b" stroke-width="3"/>
      <circle cx="34" cy="34" r="20" fill="#087f5b"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">6</text>
      <text x="68" y="42" font-size="21" font-weight="700" fill="#14213d">建立量測基準</text>
      <text x="22" y="80" font-size="15" fill="#334155">ingest → measure → anchor</text>
      <text x="22" y="106" font-size="15" fill="#334155">固定比較座標</text>
      <text x="22" y="137" font-size="14" font-weight="700" fill="#087f5b">輸出：baseline readings</text>
    </g>
    <g transform="translate(880 382)">
      <rect width="230" height="160" rx="20" fill="#ffffff" stroke="#087f5b" stroke-width="3"/>
      <circle cx="34" cy="34" r="20" fill="#087f5b"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">7</text>
      <text x="68" y="42" font-size="21" font-weight="700" fill="#14213d">迭代與裁決</text>
      <text x="22" y="80" font-size="15" fill="#334155">preregister → measure</text>
      <text x="22" y="106" font-size="15" fill="#334155">judge：PASS 才準入</text>
      <text x="22" y="137" font-size="14" font-weight="700" fill="#087f5b">可選：融合與消融</text>
    </g>
    <g transform="translate(600 382)">
      <rect width="230" height="160" rx="20" fill="#ffffff" stroke="#b45309" stroke-width="3"/>
      <circle cx="34" cy="34" r="20" fill="#b45309"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">8</text>
      <text x="68" y="42" font-size="21" font-weight="700" fill="#14213d">產生測試預測</text>
      <text x="22" y="80" font-size="15" fill="#334155">檔案型：submission.csv</text>
      <text x="22" y="106" font-size="15" fill="#334155">Kernel 型：notebook + weights</text>
      <text x="22" y="137" font-size="14" font-weight="700" fill="#b45309">關卡：格式與身分一致</text>
    </g>
    <g transform="translate(320 382)">
      <rect width="230" height="160" rx="20" fill="#ffffff" stroke="#be123c" stroke-width="3"/>
      <circle cx="34" cy="34" r="20" fill="#be123c"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">9</text>
      <text x="68" y="42" font-size="21" font-weight="700" fill="#14213d">治理提交</text>
      <text x="22" y="80" font-size="15" fill="#334155">stage → verify → upload</text>
      <text x="22" y="106" font-size="15" fill="#334155">sync / record 平台結果</text>
      <text x="22" y="137" font-size="14" font-weight="700" fill="#be123c">關卡：配額與重複檢查</text>
    </g>
    <g transform="translate(40 382)">
      <rect width="230" height="160" rx="20" fill="#ffffff" stroke="#be123c" stroke-width="3"/>
      <circle cx="34" cy="34" r="20" fill="#be123c"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">10</text>
      <text x="72" y="42" font-size="21" font-weight="700" fill="#14213d">sealed 決選</text>
      <text x="22" y="80" font-size="15" fill="#334155">只讀保留集做最後選擇</text>
      <text x="22" y="106" font-size="15" fill="#334155">final 封存候選</text>
      <text x="22" y="137" font-size="14" font-weight="700" fill="#be123c">關卡：封槍後禁止漂移</text>
    </g>

    <g transform="translate(40 682)">
      <rect width="230" height="160" rx="20" fill="#ffffff" stroke="#3f4a5a" stroke-width="3"/>
      <circle cx="34" cy="34" r="20" fill="#3f4a5a"/>
      <text x="34" y="41" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">11</text>
      <text x="72" y="42" font-size="21" font-weight="700" fill="#14213d">結論式備份</text>
      <text x="22" y="80" font-size="15" fill="#334155">manifest → tier 1 / 2 / 3</text>
      <text x="22" y="106" font-size="15" fill="#334155">push → verify → pull 演練</text>
      <text x="22" y="137" font-size="14" font-weight="700" fill="#3f4a5a">結果：整條證據鏈可恢復</text>
    </g>
  </g>

  <g font-family="Segoe UI, Microsoft JhengHei, sans-serif">
    <g transform="translate(492 675)">
      <rect width="235" height="174" rx="87" fill="#fff7ed" stroke="#b45309" stroke-width="3" stroke-dasharray="10 7"/>
      <text x="117" y="55" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">持續迭代回路</text>
      <text x="117" y="91" text-anchor="middle" font-size="15" fill="#334155">新想法 → 新 ID</text>
      <text x="117" y="119" text-anchor="middle" font-size="15" fill="#334155">預登記 → 量測 → 裁決</text>
      <text x="117" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">不要偷看 sealed</text>
    </g>
    <g transform="translate(947 675)">
      <rect width="595" height="174" rx="24" fill="#14213d"/>
      <text x="297" y="48" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">外部平台只負責執行與計分</text>
      <text x="297" y="86" text-anchor="middle" font-size="16" fill="#dbeafe">Kaggle CLI 持有憑證；vcp 記錄候選、證據與平台回傳結果</text>
      <text x="297" y="120" text-anchor="middle" font-size="16" fill="#dbeafe">模型框架可替換；資料身分、裁決與提交紀錄保持一致</text>
      <text x="297" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#93c5fd">這就是 vcp 的通用性邊界</text>
    </g>
  </g>

  <rect x="40" y="922" width="1502" height="72" rx="18" fill="#e8eef7" stroke="#94a3b8"/>
  <text x="791" y="952" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="16" font-weight="700" fill="#14213d">紅燈處理原則</text>
  <text x="791" y="978" text-anchor="middle" font-family="Segoe UI, Microsoft JhengHei, sans-serif" font-size="15" fill="#334155">修正前一步的資料或決策，保留既有紀錄；不可變檔案需要改版時建立新 ID</text>
</svg>
