name: Bug report
description: A command did something other than what it promised
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real credentials, tokens or private competition data.
        VERDICT fields are designed to identify the dataset, run or artifact without them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        $ uv run vcp eval measure --run baseline
        Expected one reading per eval subset; got ABORT instead.
    validations:
      required: true

  - type: textarea
    id: verdict
    attributes:
      label: The VERDICT line and exit code
      description: The last line of the command, plus `echo $?` / `$LASTEXITCODE`.
      render: text
      placeholder: |
        VERDICT cmd=eval.measure status=ABORT run=baseline guardrail=FAIL anchor=e33a845b4d93 got=0.68
        exit code: 2
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence of commands that shows it. `examples/quickstart.py` is a good starting point if you can reproduce it there.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `uv run vcp version`.
      placeholder: 0.8.0+ga537f35…
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Relevant extras installed (`dicom`, `postgres`), plugins in use, or anything unusual about the data shape.
